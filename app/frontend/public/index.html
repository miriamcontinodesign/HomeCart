<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Your AI grocery companion for shopping abroad with home in mind." />

    <!-- Icons: generated from public/brand/homecart-app-icon-cream.svg -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Browser chrome uses the light theme's bg/app token (light is the default mode) -->
    <meta name="theme-color" content="#F6ECDC" />

    <!-- Fonts (theme/typography.ts): Fraunces 600 for headings (SOFT 100, optical size follows
         the size), DM Sans 400/500 for body and UI, Noto Sans as the fallback for other scripts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600,100&family=DM+Sans:wght@400;500&family=Noto+Sans:wght@400;500&display=swap" />
    <style id="homecart-type">
      /* Base font for any text without a typography token, and for form controls. */
      html, body, input, textarea, button, select { font-family: 'DM Sans', 'Noto Sans', system-ui, sans-serif; }
      /* Fraunces: optical size follows the font size; SOFT is fixed at 100 by the font request. */
      * { font-optical-sizing: auto; }
    </style>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
