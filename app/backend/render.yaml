# Render Blueprint for the HomeCart FastAPI backend.
# Connect this repo on render.com → New → Blueprint → point at this file.
# Render will provision the web service, install deps, and run uvicorn.
#
# REQUIRED ENV VARS (set these in the Render dashboard, NOT in this file):
#   SUPABASE_URL              - copy from app/backend/.env
#   SUPABASE_SERVICE_KEY      - copy from app/backend/.env
#   OPENROUTER_API_KEY        - copy from app/backend/.env
#   GOOGLE_MAPS_API_KEY       - copy from app/backend/.env
#
# Optional (model routing — copy the LLM_* lines from app/backend/.env to run on free models):
#   LLM_VISION_MODEL          - default openai/gpt-5.4-nano
#   LLM_VISION_FALLBACKS      - comma-separated backups, tried in order
#   LLM_TEXT_MODEL            - default deepseek/deepseek-v4-flash
#   LLM_TEXT_FALLBACKS        - comma-separated backups, tried in order
#   SCAN_DAILY_LIMIT / RECIPE_DAILY_LIMIT - per-user quota on the shared key (default 10 / 3)

services:
  - type: web
    name: homecart-backend
    runtime: python
    rootDir: app/backend
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
